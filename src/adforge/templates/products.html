{% extends "base.html" %}{% block content %}<div class="hero"><div><p class="eyebrow">SOURCE OF TRUTH</p><h1>Products</h1></div></div><section class="card">{% for product in products %}<a class="row" href="/products/{{ product.id }}"><span>{{ product.name }}</span><span class="status {{ product.truth_readiness.value|lower }}">{{ product.truth_readiness.value }}</span></a>{% else %}<p class="muted">No products registered.</p>{% endfor %}</section>{% endblock %}
