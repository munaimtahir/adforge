{% extends "base.html" %}{% block content %}<p class="eyebrow">NEW PRODUCTION</p><h1>New campaign</h1>{% if active %}<div class="notice blocked">BLOCKED — {{ active.name }} holds the active production lease.</div>{% endif %}<form class="card form" method="post" action="/campaigns" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Product<select name="product_id" required>{% for product in products %}<option value="{{ product.id }}">{{ product.name }} · {{ product.truth_readiness.value }}</option>{% endfor %}</select></label><label>Campaign name<input name="name" required maxlength="100"></label><label>Brief<textarea name="brief" required maxlength="10000" rows="8"></textarea></label><label>APK (optional)<input name="apk_file" type="file" accept=".apk"></label><label>...or an APK path already on the server (optional, under the configured import root)<input name="apk_path" type="text"></label><button class="primary" {% if active %}disabled{% endif %}>Create campaign</button></form>{% endblock %}
