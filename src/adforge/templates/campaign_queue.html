{% extends "base.html" %}{% block content %}<div class="hero"><div><p class="eyebrow">SINGLE-LANE QUEUE</p><h1>Campaign queue</h1></div><a class="button primary" href="/campaigns/new">New campaign</a></div><section class="card">{% for campaign in campaigns %}<a class="row" href="/campaigns/{{ campaign.id }}"><span><strong>{{ campaign.name }}</strong><small>{{ campaign.brief[:90] }}</small></span><span class="status {{ campaign.state.value|lower }}">{{ campaign.state.value }}</span></a>{% else %}<p class="muted">Queue is empty.</p>{% endfor %}</section>{% endblock %}
