{% extends "base.html" %}{% block content %}<p class="eyebrow">SOURCE OF TRUTH</p><h1>New product</h1>{% if error %}<div class="notice blocked">{{ error }}</div>{% endif %}<form class="card form" method="post" action="/products"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Name<input name="name" required maxlength="100"></label><label>Slug (lowercase, hyphenated; also used as the product ID -- <code>product_id</code> in the Product Truth JSON below must match it exactly)<input name="slug" required maxlength="100" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Product Truth JSON (schema: <code>schemas/product_truth.schema.json</code>)<textarea name="product_truth_json" required rows="20" placeholder='{"product_id": "your-slug", "product_name": "...", "approved_features": [], "prohibited_claims": [], "evidence": [], "last_verified_at": "..."}'></textarea></label><button class="primary">Create product</button></form>{% endblock %}
