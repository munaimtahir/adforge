[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adforge"
version = "0.1.0"
description = "Truth-gated autonomous advertisement production control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.10,<5",
  "pydantic>=2.10,<3",
  "playwright>=1.50,<2",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adforge"]
exclude = ["tests"]
